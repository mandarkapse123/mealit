name: Family Meal & Grocery Telegram Notifier

on:
  schedule:
    # -----------------------------------------------------------------------------------------
    # 1. BREAKFAST REMINDER (2 hours before 8:00 AM breakfast -> 06:00 AM IST / 00:30 UTC)
    # -----------------------------------------------------------------------------------------
    - cron: '30 0 * * *'

    # -----------------------------------------------------------------------------------------
    # 2. LUNCH REMINDER (2 hours before 1:00 PM lunch -> 11:00 AM IST / 05:30 UTC)
    # -----------------------------------------------------------------------------------------
    - cron: '30 5 * * *'

    # -----------------------------------------------------------------------------------------
    # 3. DINNER REMINDER (2 hours before 8:00 PM dinner -> 06:00 PM IST / 12:30 UTC Mon-Sat)
    # -----------------------------------------------------------------------------------------
    - cron: '30 12 * * 1-6'

    # -----------------------------------------------------------------------------------------
    # 4. WEEKLY GROCERY & COMING WEEK MEALS (Every Sunday at 6:00 PM IST / 12:30 UTC)
    # -----------------------------------------------------------------------------------------
    - cron: '30 12 * * 0'

  workflow_dispatch:
    inputs:
      notify_mode:
        description: 'Notification Type'
        required: true
        type: choice
        options:
          - auto
          - breakfast
          - lunch
          - dinner
          - snacks
          - daily_summary
          - weekly_grocery
        default: auto
      dry_run:
        description: 'Dry run mode (logs output without sending Telegram messages)'
        required: false
        type: boolean
        default: false
      override_date:
        description: 'Override target date (YYYY-MM-DD, leave blank for today)'
        required: false
        type: string
        default: ''

jobs:
  notify:
    name: Send Telegram Meal / Grocery Digest to iPad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'notifier/package.json'

      - name: Install Notifier Dependencies
        working-directory: ./notifier
        run: npm ci

      - name: Determine Active Notification Mode
        id: mode_check
        run: |
          # If manual trigger, use input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.notify_mode }}" >> $GITHUB_OUTPUT
          else
            # For scheduled cron: check if today is Sunday 12:30 UTC (6PM IST)
            DOW=$(date -u +%u) # 7 is Sunday
            HOUR=$(date -u +%H)
            if [ "$DOW" = "7" ] && [ "$HOUR" = "12" ]; then
              echo "mode=weekly_grocery" >> $GITHUB_OUTPUT
            else
              echo "mode=auto" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Execute Notifier Script
        working-directory: ./notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          NOTIFY_MODE: ${{ steps.mode_check.outputs.mode }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          OVERRIDE_DATE: ${{ github.event.inputs.override_date || '' }}
        run: node notify.js
